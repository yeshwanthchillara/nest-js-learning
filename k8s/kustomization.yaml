apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - deployment.yaml
  - service.yaml
  - configmap.yaml
  - secret.yaml
  - ingress.yaml
  - hpa.yaml

secretGenerator:
  - name: task-management-cert-secret
    files:
      - ca.pem=certs/ca.pem

generatorOptions:
  disableNameSuffixHash: true