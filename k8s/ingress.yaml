apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: task-management-ingress

  annotations:
    nginx.ingress.kubernetes.io/proxy-next-upstream: "off"

spec:
  ingressClassName: nginx

  rules:
    - host: task-management.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: task-management-service
                port:
                  number: 80